name: 每日更新游戏数据（最新上架版）

on:
  schedule:
    # 每天 UTC 0点（北京时间早上8点）自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持在网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: 抓取最新上架游戏并更新 games.json
        run: |
          cat << 'EOF' > fetch_games.py
          import json, re, time
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup

          url = 'https://www.lizisy.com/wap/?tgid=426'
          games = []
          seen_hrefs = set()

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1',
                      viewport={'width': 375, 'height': 812},
                      is_mobile=True
                  )
                  page = context.new_page()
                  print('正在打开页面...')
                  page.goto(url, wait_until='networkidle', timeout=30000)

                  # ========== 关键步骤：点击“最新上架”标签 ==========
                  try:
                      # 尝试多种方式定位“最新上架”标签
                      latest_tab = page.get_by_text('最新上架', exact=False).first
                      latest_tab.click()
                      print('已点击“最新上架”标签')
                      time.sleep(3)  # 等待列表切换完成
                  except Exception as e:
                      print('未找到“最新上架”标签，使用默认视图:', e)
                      # 兜底：尝试点击 a 标签里含“最新上架”文字
                      try:
                          page.click('a:has-text("最新上架")')
                          print('已点击“最新上架”链接')
                          time.sleep(3)
                      except:
                          print('两种方式都失败，使用当前视图')

                  # 等待游戏列表容器渲染
                  try:
                      page.wait_for_selector('ul.zy_game_lb li', timeout=10000)
                  except:
                      print('未找到 ul.zy_game_lb，等待 5 秒后继续')
                      time.sleep(5)

                  html = page.content()
                  browser.close()
                  print('页面渲染完成，开始解析...')

              soup = BeautifulSoup(html, 'html.parser')
              container = soup.select_one('ul.zy_game_lb')
              if container:
                  items = container.select('li')
                  print(f'列表容器内找到 {len(items)} 个 li')
                  for li in items:
                      if len(games) >= 5:
                          break
                      a = li.find('a', href=True)
                      if not a: continue
                      href = a.get('href', '')
                      if not re.search(r'/wg/\d+/\d+\.html', href): continue
                      if href in seen_hrefs: continue
                      seen_hrefs.add(href)
                      if not href.startswith('http'):
                          href = 'https://www.lizisy.com' + href

                      name = ''
                      h3 = li.find('h3')
                      if h3: name = h3.get_text(strip=True)
                      if not name: name = a.get_text(strip=True).split('\n')[0].strip()
                      if not name or len(name) < 2: continue

                      img = li.find('img')
                      icon_url = ''
                      if img:
                          icon_url = img.get('src') or img.get('data-src') or img.get('data-original') or ''
                          if icon_url.startswith('//'): icon_url = 'https:' + icon_url
                          elif icon_url.startswith('/'): icon_url = 'https://www.lizisy.com' + icon_url

                      games.append({
                          'name': name,
                          'icon': icon_url,
                          'tags': ['最新上架'],
                          'desc': f'{name}，最新上架热门游戏，快来体验！',
                          'url': href
                      })

              print(f'成功提取 {len(games)} 个游戏')
              for g in games:
                  print(f'  - {g["name"]}  →  {g["url"]}')

          except Exception as e:
              print('抓取失败:', e)

          if len(games) > 0:
              with open('games.json', 'w', encoding='utf-8') as f:
                  json.dump(games, f, ensure_ascii=False, indent=2)
              print('✅ games.json 已成功更新')
          else:
              print('⚠️ 未抓取到任何游戏，保留原有 games.json 内容')
          EOF
          python fetch_games.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --staged --quiet || git commit -m "自动更新游戏数据 $(date +%Y-%m-%d)"
          git push

      - name: 清除 CDN 缓存
        run: |
          echo "正在清除 jsDelivr 缓存..."
          curl "https://purge.jsdelivr.net/gh/wwwww56/my-games@main/games.json"
          echo "缓存清除请求已发送"
