name: 每日更新游戏数据

on:
  schedule:
    # 每天 UTC 0点（北京时间早上8点）自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持在网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 抓取最新游戏数据并更新 games.json
        run: |
          cat << 'EOF' > fetch_games.py
          import requests, json, re
          from bs4 import BeautifulSoup

          url = 'https://www.lizisy.com/wap/?tgid=426'
          headers = {
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1'
          }
          try:
              res = requests.get(url, headers=headers, timeout=20)
              res.encoding = 'utf-8'
              soup = BeautifulSoup(res.text, 'html.parser')

              games = []
              # 精准定位“热门推荐”游戏列表容器
              container = soup.select_one('ul.zy_game_lb')
              if container:
                  items = container.select('li.game_item')[:5]  # 取前5个游戏
                  for li in items:
                      a = li.find('a')
                      img = li.find('img')
                      h3 = li.find('h3')
                      if not (a and h3):
                          continue
                      
                      name = h3.get_text(strip=True)
                      icon_url = img.get('src', '') if img else ''
                      
                      # 处理图片地址（http:// 或 相对路径）
                      if icon_url.startswith('//'):
                          icon_url = 'https:' + icon_url
                      elif icon_url.startswith('/'):
                          icon_url = 'https://www.lizisy.com' + icon_url
                      
                      href = a.get('href', '')
                      if not href.startswith('http'):
                          href = 'https://www.lizisy.com' + href
                      
                      # 提取标签（如"仙侠 角色"、"专服"等）
                      tags = []
                      p_tag = li.select_one('.game_con p')
                      if p_tag:
                          tags = p_tag.get_text(strip=True).split()
                      fl_tag = li.select_one('.game_fl span')
                      if fl_tag:
                          tags.append(fl_tag.get_text(strip=True))
                      
                      games.append({
                          'name': name,
                          'icon': icon_url,
                          'tags': tags if tags else ['热门推荐'],
                          'desc': f'{name}，热门推荐游戏，快来体验！',
                          'url': href
                      })

              with open('games.json', 'w', encoding='utf-8') as f:
                  json.dump(games, f, ensure_ascii=False, indent=2)

              print(f'成功抓取 {len(games)} 个游戏')
          except Exception as e:
              print('抓取失败:', e)
              raise e
          EOF
          python fetch_games.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --staged --quiet || git commit -m "自动更新游戏数据 $(date +%Y-%m-%d)"
          git push
