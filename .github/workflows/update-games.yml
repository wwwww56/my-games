name: 每日更新游戏数据（无头浏览器版）

on:
  schedule:
    # 每天 UTC 0点（北京时间早上8点）自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持在网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: 抓取最新游戏数据并更新 games.json
        run: |
          cat << 'EOF' > fetch_games.py
          import json, re, time
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup

          url = 'https://www.lizisy.com/wap/?tgid=426'
          games = []
          seen_hrefs = set()

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      user_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/15.0 Mobile/15E148 Safari/604.1',
                      viewport={'width': 375, 'height': 812},
                      is_mobile=True
                  )
                  page = context.new_page()
                  print('正在打开页面...')
                  page.goto(url, wait_until='networkidle', timeout=30000)
                  
                  # 等待游戏列表渲染
                  time.sleep(3)
                  
                  # 获取渲染后的完整 HTML
                  html = page.content()
                  browser.close()
                  print('页面渲染完成，开始解析...')

              soup = BeautifulSoup(html, 'html.parser')

              # 查找所有包含 /wg/ 的详情页链接
              all_links = soup.find_all('a', href=True)
              print(f'渲染后共找到 {len(all_links)} 个链接')

              for a in all_links:
                  if len(games) >= 5:
                      break
                  href = a.get('href', '')
                  
                  # 匹配游戏详情页链接：/wg/数字/数字.html
                  if not re.search(r'/wg/\d+/\d+\.html', href):
                      continue
                  if href in seen_hrefs:
                      continue
                  seen_hrefs.add(href)

                  if not href.startswith('http'):
                      href = 'https://www.lizisy.com' + href

                  # 提取名称
                  name = ''
                  h3 = a.find('h3')
                  if h3:
                      name = h3.get_text(strip=True)
                  else:
                      text = a.get_text(strip=True)
                      name = text.split('\n')[0].strip() if text else ''

                  if not name or len(name) < 2:
                      continue

                  # 提取图标
                  img = a.find('img')
                  if not img:
                      parent_li = a.find_parent('li')
                      if parent_li:
                          img = parent_li.find('img')

                  icon_url = ''
                  if img:
                      icon_url = img.get('src') or img.get('data-src') or img.get('data-original') or ''
                      if icon_url.startswith('//'):
                          icon_url = 'https:' + icon_url
                      elif icon_url.startswith('/'):
                          icon_url = 'https://www.lizisy.com' + icon_url

                  games.append({
                      'name': name,
                      'icon': icon_url,
                      'tags': ['热门推荐'],
                      'desc': f'{name}，热门推荐游戏，快来体验！',
                      'url': href
                  })

              print(f'成功提取 {len(games)} 个游戏')
              for g in games:
                  print(f'  - {g["name"]}  →  {g["url"]}')

          except Exception as e:
              print('抓取失败:', e)

          # 兜底保护：只有成功抓取到游戏才覆盖文件
          if len(games) > 0:
              with open('games.json', 'w', encoding='utf-8') as f:
                  json.dump(games, f, ensure_ascii=False, indent=2)
              print('✅ games.json 已成功更新')
          else:
              print('⚠️ 未抓取到任何游戏，保留原有 games.json 内容')
          EOF
          python fetch_games.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --staged --quiet || git commit -m "自动更新游戏数据 $(date +%Y-%m-%d)"
          git push
